<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>CineStream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{--red:#E50914;--rd:#b20710;--rg:rgba(229,9,20,0.3);--rg2:rgba(229,9,20,0.1);--safe-bottom:env(safe-area-inset-bottom,0px);--safetop:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{width:100%;height:100%;background:#000;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#fff;overflow:hidden;touch-action:manipulation;-webkit-font-smoothing:antialiased;position:fixed;inset:0}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.22s ease;overflow:hidden}
.view.active{opacity:1;pointer-events:all}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(0,0,0,0.97);border-top:1px solid rgba(229,9,20,0.18);display:flex;align-items:stretch;height:56px;padding-bottom:var(--safe-bottom)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:rgba(255,255,255,0.3);transition:color 0.15s;border:none;background:none;padding:0;min-height:44px;position:relative}
.bnav-item.active{color:var(--red)}
.bnav-item::after{content:'';position:absolute;inset:0}
.bnav-item svg{width:22px;height:22px;flex-shrink:0}
.bnav-item span{font-size:9px;font-weight:600;letter-spacing:0.2px;line-height:1}

/* SCROLL VIEWS */
.scroll-view{overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:0;padding-bottom:calc(56px + var(--safe-bottom) + 8px)}

/* HERO */
.hero{width:100%;height:54vw;min-height:200px;max-height:290px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;transition:opacity 0.65s ease}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,#000 0%,rgba(0,0,0,0.5) 50%,rgba(0,0,0,0.05) 100%),linear-gradient(to right,rgba(0,0,0,0.65) 0%,transparent 60%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 14px 12px;z-index:5}
.hero-badge{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:1.2px;padding:3px 8px;border-radius:2px;margin-bottom:5px;text-transform:uppercase}
.hero-title{font-size:clamp(15px,5vw,24px);font-weight:900;line-height:1.1;text-shadow:0 1px 8px rgba(0,0,0,0.9);margin-bottom:5px;color:#fff}
.hero-meta{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.hero-rating{color:#ffd700;font-size:11px;font-weight:700}
.hero-pill{font-size:10px;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15);padding:2px 6px;border-radius:3px}
.hero-btn{background:var(--red);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:36px}
.hero-btn:active{background:var(--rd);transform:scale(0.96)}
.hero-dots{display:flex;justify-content:center;gap:5px;padding:6px 0 2px}
.hero-dot{width:16px;height:2.5px;background:rgba(255,255,255,0.18);border-radius:2px;cursor:pointer;transition:all 0.2s}
.hero-dot.active{background:var(--red);width:26px}

/* GENRES */
.genres-scroll{display:flex;gap:7px;padding:8px 14px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.genre-chip{flex-shrink:0;background:var(--rg2);border:1px solid rgba(229,9,20,0.18);color:rgba(255,255,255,0.5);padding:6px 13px;border-radius:20px;font-size:11px;cursor:pointer;transition:all 0.15s;white-space:nowrap;min-height:32px;display:flex;align-items:center}
.genre-chip.active{background:rgba(229,9,20,0.22);border-color:var(--red);color:#fff}

/* SECTION */
.section{padding:6px 0 2px}
.section-head{display:flex;align-items:center;gap:8px;padding:0 14px 8px}
.section-bar{width:3px;height:14px;background:var(--red);border-radius:2px;flex-shrink:0}
.section-title{font-size:13px;font-weight:800;color:#fff}

/* POSTER ROW */
.h-row{display:flex;gap:9px;padding:0 14px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.poster-card{flex-shrink:0;width:98px;border-radius:8px;overflow:hidden;border:1px solid rgba(229,9,20,0.08);cursor:pointer;position:relative;transition:transform 0.15s;background:#0a0000}
.poster-card:active{transform:scale(0.92);border-color:var(--red)}
.poster-card img{width:100%;height:147px;object-fit:cover;display:block}
.skel{flex-shrink:0;width:98px;height:147px;border-radius:8px;background:linear-gradient(90deg,rgba(229,9,20,0.04) 0%,rgba(229,9,20,0.1) 50%,rgba(229,9,20,0.04) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* VIEW TITLE BAR */
.vtbar{padding:14px 14px 4px;display:flex;align-items:center;gap:8px;padding-top:calc(14px + var(--safe-top))}
.vtbar h2{font-size:16px;font-weight:900;color:#fff}

/* PLATFORM BANNER */
.platform-banner{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(to right,rgba(229,9,20,0.1),transparent);border-bottom:1px solid rgba(229,9,20,0.12);margin-bottom:4px}
.plat-logo-img{height:36px;width:auto;max-width:100px;object-fit:contain;border-radius:7px;background:rgba(255,255,255,0.05);padding:4px}
.plat-name{font-size:16px;font-weight:900;color:#fff}
.plat-sub{font-size:10px;color:rgba(229,9,20,0.65);margin-top:1px}

/* OTT VIEW */
#ott-view{overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(56px + var(--safe-bottom) + 8px)}
.region-tabs{display:flex;gap:0;padding:10px 14px 6px;position:sticky;top:0;z-index:10;background:#000}
.region-tab{flex:1;padding:10px 0;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,0.38);border:1px solid rgba(229,9,20,0.18);cursor:pointer;transition:all 0.18s;letter-spacing:0.4px;min-height:40px;display:flex;align-items:center;justify-content:center}
.region-tab:first-child{border-radius:8px 0 0 8px}
.region-tab:last-child{border-radius:0 8px 8px 0;border-left:none}
.region-tab.active{background:var(--red);border-color:var(--red);color:#fff}
.ott-region-panel{display:none;padding:6px 14px 14px}
.ott-region-panel.active{display:block}
.ott-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.ott-card{background:rgba(10,0,0,0.9);border:1px solid rgba(229,9,20,0.12);border-radius:12px;cursor:pointer;transition:all 0.18s;aspect-ratio:2.4/1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;min-height:70px}
.ott-card:active{background:rgba(229,9,20,0.16);border-color:var(--red);transform:scale(0.95)}
.ott-card img{width:100%;height:100%;object-fit:contain;max-height:48px;border-radius:4px}
.ott-card-skel{aspect-ratio:2.4/1;border-radius:12px;background:linear-gradient(90deg,rgba(229,9,20,0.04) 0%,rgba(229,9,20,0.1) 50%,rgba(229,9,20,0.04) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;min-height:70px}

/* SEARCH VIEW */
#search-view{overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(56px + var(--safe-bottom) + 8px)}
.search-view-inner{padding:12px 14px 0}
.search-box-wrap{position:relative;margin-bottom:0}
.search-box{display:flex;align-items:center;gap:8px;background:rgba(14,0,0,0.97);border:1.5px solid rgba(229,9,20,0.3);border-radius:12px;padding:0 12px;transition:border-color 0.18s;min-height:48px}
.search-box.focused{border-color:var(--red);box-shadow:0 0 10px rgba(229,9,20,0.12)}
.search-box svg{width:17px;height:17px;flex-shrink:0;color:rgba(229,9,20,0.55)}
#main-search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;padding:13px 0;caret-color:var(--red);-webkit-appearance:none}
#main-search-input::placeholder{color:rgba(255,255,255,0.22)}
.search-clear-btn{background:none;border:none;color:rgba(229,9,20,0.55);font-size:20px;cursor:pointer;padding:6px;line-height:1;min-width:32px;min-height:32px;display:none;align-items:center;justify-content:center}
.search-clear-btn.show{display:flex}

/* AUTOCOMPLETE */
#autocomplete-drop{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:500;background:#080000;border:1px solid rgba(229,9,20,0.2);border-radius:12px;overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.95)}
.ac-section-label{padding:7px 12px 4px;font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:rgba(229,9,20,0.58);border-bottom:1px solid rgba(229,9,20,0.06)}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(229,9,20,0.05);min-height:52px}
.ac-item:active{background:rgba(229,9,20,0.1)}
.ac-poster{width:30px;height:46px;border-radius:4px;object-fit:cover;flex-shrink:0;border:1px solid rgba(229,9,20,0.15)}
.ac-ph{width:30px;height:46px;border-radius:4px;flex-shrink:0;background:rgba(229,9,20,0.07);display:flex;align-items:center;justify-content:center}
.ac-info{flex:1;min-width:0}
.ac-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-meta{display:flex;align-items:center;gap:6px}
.ac-type{font-size:9px;font-weight:700;color:rgba(229,9,20,0.7);text-transform:uppercase;letter-spacing:0.4px}
.ac-year{font-size:9px;color:rgba(255,255,255,0.3)}
.ac-rating{font-size:9px;color:#ffd700;margin-left:auto}
.ac-query-row{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;border-bottom:1px solid rgba(229,9,20,0.06);min-height:48px}
.ac-query-row:active{background:rgba(229,9,20,0.1)}
.ac-q-icon{width:32px;height:32px;border-radius:50%;background:rgba(229,9,20,0.09);border:1px solid rgba(229,9,20,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ac-q-text{font-size:13px;color:rgba(255,255,255,0.7)}
.ac-q-text b{color:#fff}

/* RECENT / TRENDING */
.recent-section{margin-top:16px}
.recent-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 9px}
.recent-title{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(229,9,20,0.68)}
.recent-clear{font-size:11px;color:rgba(255,255,255,0.28);cursor:pointer;min-height:32px;display:flex;align-items:center}
.recent-chips{display:flex;flex-wrap:wrap;gap:7px}
.recent-chip{display:flex;align-items:center;gap:5px;background:var(--rg2);border:1px solid rgba(229,9,20,0.15);border-radius:20px;padding:6px 12px;font-size:11px;color:rgba(255,255,255,0.58);cursor:pointer;min-height:34px}
.recent-chip:active{background:rgba(229,9,20,0.18);color:#fff;border-color:var(--red)}
.recent-chip-x{color:rgba(229,9,20,0.4);font-size:14px;line-height:1;padding-left:3px;min-width:16px;text-align:center}
.trending-section{margin-top:18px}
.trending-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.trending-card{display:flex;align-items:center;gap:8px;background:rgba(12,0,0,0.7);border:1px solid rgba(229,9,20,0.09);border-radius:8px;padding:8px 10px;cursor:pointer;transition:all 0.14s;overflow:hidden;min-height:52px}
.trending-card:active{background:rgba(229,9,20,0.12);border-color:var(--red);transform:scale(0.97)}
.trending-num{font-size:14px;font-weight:900;color:rgba(229,9,20,0.42);min-width:18px;flex-shrink:0}
.trending-info{flex:1;min-width:0}
.trending-title{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trending-sub{font-size:9px;color:rgba(255,255,255,0.3);margin-top:2px}
.trending-thumb{width:36px;height:36px;border-radius:5px;object-fit:cover;flex-shrink:0;border:1px solid rgba(229,9,20,0.12)}

/* RESULTS */
.results-area{margin-top:14px}
.results-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px}
.results-title{font-size:12px;color:rgba(255,255,255,0.5)}
.results-title b{color:#fff}
.results-count{font-size:10px;color:rgba(229,9,20,0.58)}
.results-filter{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-btn{flex-shrink:0;background:transparent;border:1px solid rgba(229,9,20,0.2);color:rgba(255,255,255,0.4);padding:7px 14px;border-radius:20px;font-size:11px;cursor:pointer;transition:all 0.15s;min-height:34px}
.filter-btn.active{background:rgba(229,9,20,0.18);border-color:var(--red);color:#fff}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.result-card{border-radius:8px;overflow:hidden;border:1px solid rgba(229,9,20,0.07);cursor:pointer;transition:transform 0.14s;background:rgba(8,0,0,0.5)}
.result-card:active{transform:scale(0.93);border-color:var(--red)}
.result-card img{width:100%;height:130px;object-fit:cover;display:block}
.no-results{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:10px}
.no-results-icon{font-size:40px;opacity:0.25}
.no-results-text{font-size:14px;color:rgba(255,255,255,0.3);text-align:center}
.no-results-sub{font-size:11px;color:rgba(229,9,20,0.38);text-align:center}

/* DETAIL VIEW */
#detail-view{overflow-y:scroll;-webkit-overflow-scrolling:touch;padding-bottom:calc(56px + var(--safe-bottom))}
.detail-trailer-top{width:100%;aspect-ratio:16/9;position:relative;background:#000;overflow:hidden}
.detail-trailer-top iframe{width:100%;height:100%;border:none;display:block}
.detail-trailer-fallback{width:100%;height:100%;background-size:cover;background-position:center top;position:absolute;inset:0}
.detail-trailer-fallback-grad{position:absolute;inset:0;background:linear-gradient(to top,#000 0%,rgba(0,0,0,0.15) 60%,transparent 100%)}
.detail-back{position:fixed;top:calc(12px + var(--safe-top));left:12px;z-index:400;background:rgba(0,0,0,0.8);border:1px solid rgba(229,9,20,0.35);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:24px;line-height:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.detail-back:active{background:var(--red);transform:scale(0.92)}
.detail-body{padding:0 14px calc(20px + var(--safe-bottom));background:#000}
.dprow{display:flex;gap:12px;align-items:flex-start;padding:10px 0 10px}
.dposter{width:88px;flex-shrink:0;border-radius:8px;overflow:hidden;border:1px solid rgba(229,9,20,0.28);box-shadow:0 2px 12px rgba(229,9,20,0.15)}
.dposter img{width:100%;display:block}
.dpinfo{flex:1;padding-top:2px}
.dbadges{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.badge-r{background:var(--red);color:#fff;font-size:9px;font-weight:800;letter-spacing:1.2px;padding:3px 8px;border-radius:2px;text-transform:uppercase}
.badge-o{background:transparent;color:var(--red);border:1px solid var(--red);font-size:9px;font-weight:700;padding:3px 8px;border-radius:2px}
.dtitle{font-size:clamp(16px,5vw,26px);font-weight:900;line-height:1.1;color:#fff;margin-bottom:4px;cursor:pointer;display:inline-block}
.dtitle:active{opacity:0.72}
.copy-toast{position:fixed;bottom:calc(70px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:rgba(229,9,20,0.9);color:#fff;font-size:11px;font-weight:700;padding:8px 18px;border-radius:20px;z-index:999;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap}
.copy-toast.show{opacity:1}
.dtagline{font-size:11px;font-style:italic;color:rgba(229,9,20,0.68);margin-bottom:5px}
.ddate{font-size:11px;color:rgba(229,9,20,0.6);margin-top:3px;display:flex;align-items:center;gap:5px}
.doverview{font-size:13px;line-height:1.65;color:rgba(255,255,255,0.62);margin-bottom:16px}
.sec-lbl{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:rgba(229,9,20,0.72);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec-lbl-line{flex:1;height:1px;background:rgba(229,9,20,0.15)}
.info-tbl{width:100%;border-collapse:collapse;margin-bottom:18px;background:rgba(6,0,0,0.8);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
.info-tbl thead tr{background:rgba(229,9,20,0.15)}
.info-tbl thead td{padding:9px 12px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(229,9,20,0.85)}
.info-tbl tbody tr{border-top:1px solid rgba(255,255,255,0.06)}
.info-tbl tbody tr:nth-child(even){background:rgba(255,255,255,0.015)}
.info-tbl tbody td{padding:10px 12px;font-size:12px;vertical-align:top;line-height:1.5;border-right:1px solid rgba(255,255,255,0.06)}
.info-tbl tbody td:first-child{color:rgba(229,9,20,0.8);font-weight:700;font-size:9px;letter-spacing:0.6px;text-transform:uppercase;width:86px;white-space:nowrap}
.info-tbl tbody td:last-child{color:rgba(255,255,255,0.78);border-right:none}
.cast-row{display:flex;gap:14px;overflow-x:auto;padding:0 0 14px;-webkit-overflow-scrolling:touch;margin-bottom:14px}
.cast-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px}
.cast-avatar{width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid rgba(229,9,20,0.35);background:rgba(18,0,0,0.8);flex-shrink:0}
.cast-avatar img{width:100%;height:100%;object-fit:cover;object-position:top}
.cast-name{font-size:10px;font-weight:700;color:rgba(255,255,255,0.82);text-align:center;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cast-char{font-size:9px;color:rgba(229,9,20,0.6);text-align:center;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.season-sel{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.season-btn{flex-shrink:0;background:var(--rg2);border:1px solid rgba(229,9,20,0.18);color:rgba(255,255,255,0.48);padding:7px 14px;border-radius:20px;font-size:11px;cursor:pointer;transition:all 0.16s;white-space:nowrap;min-height:34px}
.season-btn.active{background:rgba(229,9,20,0.2);border-color:var(--red);color:#fff}
.ep-list{display:flex;flex-direction:column;gap:7px;max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ep-card{background:rgba(12,0,0,0.75);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 11px;display:flex;gap:10px;align-items:flex-start}
.ep-num{font-size:13px;font-weight:900;color:var(--red);min-width:26px;flex-shrink:0;line-height:1.2}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:3px;line-height:1.3}
.ep-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.ep-date{font-size:10px;color:rgba(229,9,20,0.6)}
.ep-rating{font-size:10px;color:#ffd700}
.ep-rt{font-size:10px;color:rgba(255,255,255,0.32)}
.ep-ov{font-size:10px;color:rgba(255,255,255,0.38);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-thumb{width:68px;height:44px;border-radius:5px;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,0.07);background:rgba(18,0,0,0.5)}

/* LOADING / ERROR */
.loading-overlay{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.ring{width:46px;height:46px;border:3px solid rgba(229,9,20,0.12);border-top-color:var(--red);border-radius:50%;animation:spin 0.72s linear infinite;margin-bottom:13px}
.small-ring{width:22px;height:22px;border:2px solid rgba(229,9,20,0.12);border-top-color:var(--red);border-radius:50%;animation:spin 0.72s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(229,9,20,0.65);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.35}50%{opacity:1}}
.err-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 20px;gap:8px}
.err-icon{color:var(--red)}
.err-txt{font-size:12px;color:rgba(255,255,255,0.38);text-align:center}
.err-sub{font-size:10px;color:rgba(229,9,20,0.4)}

/* ===== WEB SEARCHER - ENHANCED WITH LOGOS ===== */
.web-searcher-section{margin-bottom:20px}
.ws-engines{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.ws-engine-btn{
  display:flex;align-items:center;gap:7px;
  background:rgba(8,0,0,0.85);
  border:1.5px solid rgba(229,9,20,0.18);
  border-radius:20px;padding:6px 13px 6px 8px;
  font-size:12px;font-weight:700;
  color:rgba(255,255,255,0.55);
  cursor:pointer;transition:all 0.15s;
  white-space:nowrap;min-height:36px;
  position:relative;
}
.ws-engine-btn.active{
  border-color:var(--red);color:#fff;
  background:rgba(229,9,20,0.14);
  box-shadow:0 0 8px rgba(229,9,20,0.18)
}
.ws-engine-btn:active{transform:scale(0.95)}

/* Engine logo container */
.eng-logo-wrap{
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
}
.eng-logo-wrap img{
  width:18px;height:18px;object-fit:contain;border-radius:2px;
}
.eng-logo-wrap .eng-emoji-fallback{
  font-size:13px;line-height:1;
}

.ws-add-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1.5px dashed rgba(229,9,20,0.28);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;color:rgba(229,9,20,0.45);cursor:pointer;transition:all 0.15s;min-height:36px}
.ws-add-btn:active{border-color:var(--red);color:var(--red)}
.ws-query-row{display:flex;gap:8px;align-items:center}
.ws-query-input{flex:1;background:rgba(8,0,0,0.85);border:1.5px solid rgba(229,9,20,0.22);border-radius:10px;padding:11px 12px;font-size:14px;color:#fff;outline:none;caret-color:var(--red);min-height:46px;-webkit-appearance:none}
.ws-query-input:focus{border-color:var(--red)}
.ws-query-input::placeholder{color:rgba(255,255,255,0.18)}
.ws-go-btn{background:var(--red);border:none;border-radius:10px;padding:11px 16px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;min-height:46px;min-width:80px;justify-content:center}
.ws-go-btn:active{background:var(--rd);transform:scale(0.95)}

/* ADD ENGINE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:900;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.hidden{display:none}
.modal-sheet{background:#070000;border:1px solid rgba(229,9,20,0.22);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-bottom));width:100%;max-width:520px}
.modal-handle{width:34px;height:3px;background:rgba(229,9,20,0.28);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:4px}
.modal-sub{font-size:11px;color:rgba(255,255,255,0.32);margin-bottom:16px;line-height:1.55}
.modal-field{margin-bottom:13px}
.modal-label{font-size:10px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;color:rgba(229,9,20,0.65);margin-bottom:6px;display:block}
.modal-input{width:100%;background:rgba(12,0,0,0.95);border:1.5px solid rgba(229,9,20,0.22);border-radius:10px;padding:12px;font-size:14px;color:#fff;outline:none;caret-color:var(--red);min-height:46px;-webkit-appearance:none}
.modal-input:focus{border-color:var(--red)}
.modal-input::placeholder{color:rgba(255,255,255,0.18)}
.modal-hint{font-size:10px;color:rgba(255,255,255,0.22);margin-top:5px;line-height:1.5}
.modal-hint code{color:rgba(229,9,20,0.75);font-size:10px}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-cancel{flex:1;background:rgba(229,9,20,0.07);border:1px solid rgba(229,9,20,0.18);border-radius:10px;padding:13px;color:rgba(255,255,255,0.45);font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
.modal-save{flex:2;background:var(--red);border:none;border-radius:10px;padding:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:48px}
.modal-save:active{background:var(--rd);transform:scale(0.97)}
.modal-cancel:active{opacity:0.65}
.custom-engines-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.custom-eng-item{display:flex;align-items:center;gap:10px;background:rgba(229,9,20,0.05);border:1px solid rgba(229,9,20,0.1);border-radius:10px;padding:10px 12px;min-height:52px}
.custom-eng-name{flex:1;font-size:12px;font-weight:700;color:#fff}
.custom-eng-url{font-size:9px;color:rgba(255,255,255,0.28);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.custom-eng-del{background:none;border:none;color:rgba(229,9,20,0.45);font-size:18px;cursor:pointer;padding:4px 6px;line-height:1;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.custom-eng-del:active{color:var(--red)}

/* ENGINE LOGO PREVIEW IN MODAL */
.eng-logo-preview{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(229,9,20,0.04);border:1px solid rgba(229,9,20,0.1);border-radius:8px;margin-bottom:4px}
.eng-logo-preview img{width:24px;height:24px;object-fit:contain;border-radius:4px}
.eng-logo-preview-txt{font-size:11px;color:rgba(255,255,255,0.38)}
</style>
</head>
<body>
<div id="app">
<div class="copy-toast" id="copy-toast">Copied!</div>
<div class="loading-overlay" id="global-loading">
  <div class="ring"></div>
  <div class="load-text">Loading</div>
</div>

<!-- ADD ENGINE MODAL -->
<div class="modal-overlay hidden" id="add-engine-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Add Search Engine</div>
    <div class="modal-sub">Use <code style="color:rgba(229,9,20,0.8);font-size:11px">{query}</code> as placeholder for the search term.</div>
    <div class="modal-field">
      <label class="modal-label">Engine Name</label>
      <input class="modal-input" id="eng-name-input" placeholder="e.g. IMDb" maxlength="24" autocomplete="off"/>
    </div>
    <div class="modal-field">
      <label class="modal-label">Search URL</label>
      <input class="modal-input" id="eng-url-input" placeholder="https://example.com/search?q={query}" autocomplete="off" inputmode="url"
        oninput="previewEngLogo(this.value)"/>
      <div class="modal-hint">Replace the search term with <code>{query}</code><br>e.g. https://www.imdb.com/find?q={query}</div>
      <div id="eng-logo-preview-wrap" style="display:none;margin-top:8px">
        <div class="eng-logo-preview">
          <img id="eng-logo-preview-img" src="" alt="logo" onerror="this.style.display='none'"/>
          <span class="eng-logo-preview-txt" id="eng-logo-preview-txt">Logo auto-detected</span>
        </div>
      </div>
    </div>
    <div id="custom-engines-list-wrap" style="display:none">
      <div style="font-size:10px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;color:rgba(229,9,20,0.55);margin-bottom:7px">Your Engines</div>
      <div class="custom-engines-list" id="custom-engines-list"></div>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeEngineModal()">Cancel</button>
      <button class="modal-save" onclick="saveCustomEngine()">Add Engine</button>
    </div>
  </div>
</div>

<div id="home-view" class="view active scroll-view"></div>
<div id="movies-view" class="view scroll-view"></div>
<div id="search-view" class="view"></div>
<div id="tv-view" class="view scroll-view"></div>
<div id="ott-view" class="view"></div>
<div id="platform-view" class="view scroll-view"></div>
<div id="detail-view" class="view"></div>

<div id="bottom-nav">
  <button class="bnav-item active" id="bnav-home" onclick="goHome()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </button>
  <button class="bnav-item" id="bnav-movies" onclick="goMovies()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
    <span>Movies</span>
  </button>
  <button class="bnav-item" id="bnav-search" onclick="goSearch()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <span>Search</span>
  </button>
  <button class="bnav-item" id="bnav-tv" onclick="goTV()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
    <span>TV Shows</span>
  </button>
  <button class="bnav-item" id="bnav-ott" onclick="goOTT()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/></svg>
    <span>Platforms</span>
  </button>
</div>

<script>
const API_KEY='d971d4b212180c43e0830d20c04a68b5';
const BASE='https://api.themoviedb.org/3';
const IMG='https://image.tmdb.org/t/p/';

let heroItems=[],heroIdx=0,heroTimer=null;
let genreMap={};
let prevView='home-view';
let searchDebounce=null;
let currentFilter='all';
let allResults=[];
let recentSearches=JSON.parse(localStorage.getItem('cs_recent')||'[]');
let searchBuilt=false,moviesBuilt=false,tvBuilt=false,ottBuilt=false;
let providersIN=[],providersUS=[];
let currentRegion='IN';
let activeEngineId='google';
let customEngines=JSON.parse(localStorage.getItem('cs_custom_engines')||'[]');

/* ============================
   ENGINE LOGO AUTO-DETECTION
   ============================ */

// Known engine logo overrides (SVG inline or direct URL)
const ENGINE_LOGO_SVGS = {
  google: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`,
  bing: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path fill="#008373" d="M5 3v15.26l4.18 2.33 9.19-5.42-4.24-1.56V7.4z"/></svg>`,
  duckduckgo: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="18" height="18"><circle cx="50" cy="50" r="50" fill="#DE5833"/><text x="50" y="68" text-anchor="middle" font-size="52" fill="#fff">🦆</text></svg>`,
  youtube: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18"><path fill="#FF0000" d="M43.2 33.9c-.4 2.1-2.1 3.7-4.2 4C35.3 38.6 29.7 39 24 39s-11.3-.4-15-1.1c-2.1-.3-3.8-1.9-4.2-4C4.4 31.6 4 27.8 4 24s.4-7.6.8-9.9c.4-2.1 2.1-3.7 4.2-4C12.7 9.4 18.3 9 24 9s11.3.4 15 1.1c2.1.3 3.8 1.9 4.2 4 .4 2.3.8 6.1.8 9.9s-.4 7.6-.8 9.9z"/><path fill="#fff" d="M20 31V17l12 7z"/></svg>`,
  imdb: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="28" height="14"><rect width="60" height="30" rx="4" fill="#F5C518"/><text x="4" y="22" font-family="Arial Black,sans-serif" font-size="18" font-weight="900" fill="#000">IMDb</text></svg>`,
};

const BUILTIN_ENGINES=[
  {id:'google',   name:'Google',     emoji:'🔍', url:'https://www.google.com/search?q={query}',           domain:'google.com'},
  {id:'bing',     name:'Bing',       emoji:'🅱️', url:'https://www.bing.com/search?q={query}',             domain:'bing.com'},
  {id:'duckduckgo',name:'DuckDuckGo',emoji:'🦆', url:'https://duckduckgo.com/?q={query}',                 domain:'duckduckgo.com'},
  {id:'youtube',  name:'YouTube',    emoji:'▶️', url:'https://www.youtube.com/results?search_query={query}',domain:'youtube.com'},
  {id:'imdb',     name:'IMDb',       emoji:'🎬', url:'https://www.imdb.com/find?q={query}',               domain:'imdb.com'},
];

/* Get favicon URL for any domain */
function getFaviconUrl(domain){
  if(!domain)return null;
  // Use Google's favicon service as primary (best quality)
  return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
}

/* Extract domain from URL */
function extractDomain(url){
  try{
    const u=new URL(url);
    return u.hostname.replace(/^www\./,'');
  }catch(e){return null;}
}

/* Build engine logo HTML - tries SVG first, then favicon, then emoji */
function buildEngLogoHtml(engine){
  // Check if we have an inline SVG
  if(ENGINE_LOGO_SVGS[engine.id]){
    return`<span class="eng-logo-wrap" style="background:transparent;border:none">${ENGINE_LOGO_SVGS[engine.id]}</span>`;
  }
  // Use favicon API for known domain
  const domain = engine.domain || extractDomain(engine.url);
  if(domain){
    const faviconUrl = getFaviconUrl(domain);
    return`<span class="eng-logo-wrap">
      <img src="${faviconUrl}" alt="${engine.name}" 
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        style="width:18px;height:18px;object-fit:contain;border-radius:2px"/>
      <span class="eng-emoji-fallback" style="display:none">${engine.emoji||'🌐'}</span>
    </span>`;
  }
  // Fallback to emoji
  return`<span class="eng-logo-wrap"><span class="eng-emoji-fallback">${engine.emoji||'🌐'}</span></span>`;
}

/* Preview logo in modal when URL is typed */
function previewEngLogo(url){
  const wrap=document.getElementById('eng-logo-preview-wrap');
  const img=document.getElementById('eng-logo-preview-img');
  const txt=document.getElementById('eng-logo-preview-txt');
  if(!wrap||!img||!txt)return;
  const domain=extractDomain(url);
  if(!domain){wrap.style.display='none';return;}
  const faviconUrl=getFaviconUrl(domain);
  img.src=faviconUrl;
  img.style.display='block';
  txt.textContent=`Auto-detected: ${domain}`;
  wrap.style.display='block';
}

function getAllEngines(){return[...BUILTIN_ENGINES,...customEngines];}
function getEngineById(id){return getAllEngines().find(e=>e.id===id);}

function openEngineModal(){
  document.getElementById('add-engine-modal').classList.remove('hidden');
  document.getElementById('eng-name-input').value='';
  document.getElementById('eng-url-input').value='';
  document.getElementById('eng-logo-preview-wrap').style.display='none';
  renderCustomEnginesList();
}
function closeEngineModal(){
  document.getElementById('add-engine-modal').classList.add('hidden');
}

function renderCustomEnginesList(){
  const wrap=document.getElementById('custom-engines-list-wrap');
  const list=document.getElementById('custom-engines-list');
  if(!customEngines.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  list.innerHTML=customEngines.map(e=>{
    const domain=e.domain||extractDomain(e.url);
    const faviconUrl=domain?getFaviconUrl(domain):null;
    return`<div class="custom-eng-item">
      <span class="eng-logo-wrap" style="width:28px;height:28px;flex-shrink:0">
        ${faviconUrl
          ?`<img src="${faviconUrl}" alt="${e.name}" style="width:20px;height:20px;object-fit:contain;border-radius:2px" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><span style="display:none;font-size:14px">${e.emoji||'🌐'}</span>`
          :`<span style="font-size:14px">${e.emoji||'🌐'}</span>`}
      </span>
      <div style="flex:1;min-width:0">
        <div class="custom-eng-name">${e.name}</div>
        <div class="custom-eng-url">${e.url}</div>
      </div>
      <button class="custom-eng-del" onclick="deleteCustomEngine('${e.id}')">✕</button>
    </div>`;
  }).join('');
}

function saveCustomEngine(){
  const name=document.getElementById('eng-name-input').value.trim();
  const url=document.getElementById('eng-url-input').value.trim();
  if(!name){showToast('Enter a name for the search engine');return;}
  if(!url||!url.includes('{query}')){showToast('URL must contain {query}');return;}
  if(!url.startsWith('http')){showToast('URL must start with http://');return;}
  const id='custom_'+Date.now();
  const domain=extractDomain(url);
  customEngines.push({id,name,url,emoji:'🌐',domain,custom:true});
  localStorage.setItem('cs_custom_engines',JSON.stringify(customEngines));
  renderCustomEnginesList();
  document.getElementById('eng-name-input').value='';
  document.getElementById('eng-url-input').value='';
  document.getElementById('eng-logo-preview-wrap').style.display='none';
  refreshWebSearcherEngines();
  showToast('Engine added!');
}

function deleteCustomEngine(id){
  customEngines=customEngines.filter(e=>e.id!==id);
  localStorage.setItem('cs_custom_engines',JSON.stringify(customEngines));
  if(activeEngineId===id)activeEngineId='google';
  renderCustomEnginesList();
  refreshWebSearcherEngines();
}

function refreshWebSearcherEngines(){
  const wrap=document.getElementById('ws-engines-wrap');
  if(wrap)wrap.innerHTML=buildEnginesHtml();
}

function buildEnginesHtml(){
  return getAllEngines().map(e=>`
    <button class="ws-engine-btn${activeEngineId===e.id?' active':''}" onclick="selectEngine('${e.id}')" id="ws-eng-${e.id}">
      ${buildEngLogoHtml(e)}${e.name}
    </button>`).join('')+`
    <button class="ws-add-btn" onclick="openEngineModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Add
    </button>`;
}

function selectEngine(id){
  activeEngineId=id;
  document.querySelectorAll('.ws-engine-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('ws-eng-'+id);
  if(btn)btn.classList.add('active');
}

function wsSearch(query){
  const engine=getEngineById(activeEngineId);
  if(!engine)return;
  const url=engine.url.replace('{query}',encodeURIComponent(query));
  window.open(url,'_blank');
}

function wsGoSearch(){
  const inp=document.getElementById('ws-main-input');
  if(!inp)return;
  const q=inp.value.trim();
  if(!q)return;
  wsSearch(q);
}

function buildWebSearcher(title,type){
  const typeLabel=type==='tv'?'TV show':'movie';
  return`
    <div class="web-searcher-section">
      <div class="sec-lbl">Web Search<div class="sec-lbl-line"></div></div>
      <div id="ws-engines-wrap" class="ws-engines">${buildEnginesHtml()}</div>
      <div class="ws-query-row">
        <input class="ws-query-input" id="ws-main-input"
          value="${escAttr(title+' '+typeLabel)}"
          placeholder="Search query..."
          inputmode="search"
          onkeydown="if(event.key==='Enter'){this.blur();wsGoSearch();}"/>
        <button class="ws-go-btn" onclick="wsGoSearch()">

/* API */
async function api(ep,params={}){
  const u=new URL(`${BASE}${ep}`);
  u.searchParams.set('api_key',API_KEY);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString());
  if(!r.ok)throw new Error(`TMDB ${r.status}`);
  return r.json();
}
const imgUrl=(p,s='w342')=>p?`${IMG}${s}${p}`:null;
const money=n=>!n?'N/A':n>=1e9?`$${(n/1e9).toFixed(2)}B`:n>=1e6?`$${(n/1e6).toFixed(1)}M`:`$${n.toLocaleString()}`;
const fmtDate=d=>{if(!d)return'N/A';const dt=new Date(d);return isNaN(dt.getTime())?'N/A':dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});};
const fmtYear=d=>d?(new Date(d).getFullYear()||'N/A'):'N/A';
const errBox=msg=>`<div class="err-box"><div class="err-icon">${ICONS.warn}</div><div class="err-txt">${msg}</div><div class="err-sub">TMDB API</div></div>`;
const skels=n=>Array(n).fill('<div class="skel"></div>').join('');
const secHtml=(id,title,n=6)=>`<div class="section"><div class="section-head"><div class="section-bar"></div><div class="section-title">${title}</div></div><div class="h-row" id="${id}">${skels(n)}</div></div>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/'/g,"&#39;").replace(/"/g,"&quot;").replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* COPY */
function copyTitle(title){
  if(navigator.clipboard){navigator.clipboard.writeText(title).catch(()=>{});}
  else{const ta=document.createElement('textarea');ta.value=title;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
  showToast(`Copied: "${title.substring(0,28)}${title.length>28?'…':''}"`);
}

/* ROW RENDER */
function renderRow(row,items,type){
  if(!items||!items.length){row.innerHTML=errBox('No content available');return;}
  const f=items.filter(i=>i.poster_path);
  if(!f.length){row.innerHTML=errBox('No poster data');return;}
  row.innerHTML=f.map(item=>{
    const t=item.title||item.name||'';
    const p=imgUrl(item.poster_path,'w342');
    const mt=item.media_type||type;
    return`<div class="poster-card" onclick="openDetail(${item.id},'${mt}')"><img src="${p}" alt="${esc(t)}" loading="lazy" onerror="this.parentElement.style.display='none'"/></div>`;
  }).join('');
}
async function loadRow(rowId,endpoint,type,params={}){
  const row=document.getElementById(rowId);
  if(!row)return;
  try{const data=await api(endpoint,params);renderRow(row,data.results,type);}
  catch(e){if(row)row.innerHTML=errBox('Failed to load');}
}

async function fetchProviders(){
  try{
    const[mvIN,tvIN,mvUS,tvUS]=await Promise.all([api('/watch/providers/movie',{watch_region:'IN'}),api('/watch/providers/tv',{watch_region:'IN'}),api('/watch/providers/movie',{watch_region:'US'}),api('/watch/providers/tv',{watch_region:'US'})]);
    const buildList=(a,b)=>{
      const all=[...(a.results||[]),...(b.results||[])];
      const seen=new Set();const list=[];
      all.forEach(p=>{if(!seen.has(p.provider_id)&&p.logo_path){seen.add(p.provider_id);list.push(p);}});
      list.sort((a,b)=>a.display_priority-b.display_priority);return list;
    };
    providersIN=buildList(mvIN,tvIN);providersUS=buildList(mvUS,tvUS);
    renderProviderGrid('grid-IN',providersIN,'IN');
    renderProviderGrid('grid-US',providersUS,'US');
  }catch(e){['grid-IN','grid-US'].forEach(id=>{const g=document.getElementById(id);if(g)g.innerHTML=errBox('Failed to load providers');});}
}
function renderProviderGrid(gridId,providers,region){
  const grid=document.getElementById(gridId);if(!grid)return;
  if(!providers.length){grid.innerHTML=errBox('No providers found');return;}
  grid.innerHTML=providers.map(p=>`<div class="ott-card" onclick="loadPlatform(${p.provider_id},'${esc(p.provider_name)}','${region}')"><img src="${imgUrl(p.logo_path,'w154')}" alt="${esc(p.provider_name)}" loading="lazy" onerror="this.parentElement.style.display='none'"/></div>`).join('');
}
function switchRegion(region){
  currentRegion=region;
  document.querySelectorAll('.region-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.ott-region-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(`rtab-${region}`).classList.add('active');
  document.getElementById(`panel-${region}`).classList.add('active');
}

function setupSearchInput(){
  const inp=document.getElementById('main-search-input');
  const box=document.getElementById('search-box');
  if(!inp||!box)return;
  inp.addEventListener('focus',()=>box.classList.add('focused'));
  inp.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('focused'),200));
  inp.addEventListener('input',function(){
    const q=this.value.trim();
    const clr=document.getElementById('search-clear');
    if(clr)clr.classList.toggle('show',q.length>0);
    clearTimeout(searchDebounce);
    if(q.length<1){hideAC();renderSearchHome();return;}
    if(q.length<2){hideAC();return;}
    searchDebounce=setTimeout(()=>fetchAC(q),300);
  });
  inp.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    const q=this.value.trim();if(!q)return;
    this.blur();hideAC();saveRecent(q);doSearch(q);
  });
}
async function fetchAC(q){
  const drop=document.getElementById('autocomplete-drop');if(!drop)return;
  drop.style.display='block';
  drop.innerHTML='<div class="small-ring" style="margin:10px auto"></div>';
  try{
    const[mv,tv]=await Promise.all([api('/search/movie',{query:q}),api('/search/tv',{query:q})]);
    const mvF=mv.results.slice(0,4).filter(r=>r.poster_path||r.backdrop_path);
    const tvF=tv.results.slice(0,4).filter(r=>r.poster_path||r.backdrop_path);
    let html=`<div class="ac-query-row" onclick="acQuery('${esc(q)}')"><div class="ac-q-icon">${ICONS.search}</div><div class="ac-q-text">Search <b>"${q}"</b></div></div>`;
    if(mvF.length){
      html+=`<div class="ac-section-label">Movies</div>`;
      mvF.forEach(r=>{
        const t=r.title||'';const p=imgUrl(r.poster_path,'w92');
        const yr=fmtYear(r.release_date);const rt=r.vote_average?r.vote_average.toFixed(1):'';
        html+=`<div class="ac-item" onclick="acItem(${r.id},'movie')">${p?`<img class="ac-poster" src="${p}" alt="${esc(t)}" onerror="this.style.display='none'"/>`:`<div class="ac-ph">${ICONS.film}</div>`}<div class="ac-info"><div class="ac-title">${t}</div><div class="ac-meta"><span class="ac-type">Movie</span><span class="ac-year">${yr}</span>${rt?`<span class="ac-rating">${ICONS.star}${rt}</span>`:''}</div></div></div>`;
      });
    }
    if(tvF.length){
      html+=`<div class="ac-section-label">TV Shows</div>`;
      tvF.forEach(r=>{
        const t=r.name||'';const p=imgUrl(r.poster_path,'w92');
        const yr=fmtYear(r.first_air_date);const rt=r.vote_average?r.vote_average.toFixed(1):'';
        html+=`<div class="ac-item" onclick="acItem(${r.id},'tv')">${p?`<img class="ac-poster" src="${p}" alt="${esc(t)}" onerror="this.style.display='none'"/>`:`<div class="ac-ph">${ICONS.tv}</div>`}<div class="ac-info"><div class="ac-title">${t}</div><div class="ac-meta"><span class="ac-type">TV Show</span><span class="ac-year">${yr}</span>${rt?`<span class="ac-rating">${ICONS.star}${rt}</span>`:''}</div></div></div>`;
      });
    }
    if(!mvF.length&&!tvF.length)html=`<div style="padding:14px;text-align:center;font-size:12px;color:rgba(255,255,255,0.28)">No suggestions</div>`;
    drop.innerHTML=html;
  }catch(e){drop.innerHTML=`<div style="padding:12px;text-align:center;font-size:11px;color:rgba(229,9,20,0.5)">Autocomplete failed</div>`;}
}
function hideAC(){const d=document.getElementById('autocomplete-drop');if(d)d.style.display='none';}
function acItem(id,type){hideAC();openDetail(id,type);}
function acQuery(q){hideAC();const inp=document.getElementById('main-search-input');if(inp){inp.value=q;}saveRecent(q);doSearch(q);}
function clearSearch(){const inp=document.getElementById('main-search-input'),clr=document.getElementById('search-clear');if(inp)inp.value='';if(clr)clr.classList.remove('show');hideAC();renderSearchHome();}
function saveRecent(q){recentSearches=[q,...recentSearches.filter(s=>s.toLowerCase()!==q.toLowerCase())].slice(0,10);localStorage.setItem('cs_recent',JSON.stringify(recentSearches));}
function removeRecent(q,e){e.stopPropagation();recentSearches=recentSearches.filter(s=>s!==q);localStorage.setItem('cs_recent',JSON.stringify(recentSearches));renderSearchHome();}
function clearAllRecent(){recentSearches=[];localStorage.setItem('cs_recent',JSON.stringify(recentSearches));renderSearchHome();}
function recentClick(q){const inp=document.getElementById('main-search-input'),clr=document.getElementById('search-clear');if(inp){inp.value=q;if(clr)clr.classList.add('show');}doSearch(q);}

async function renderSearchHome(){
  const body=document.getElementById('search-body');if(!body)return;
  let html='';
  if(recentSearches.length){
    html+=`<div class="recent-section"><div class="recent-header"><div class="recent-title">Recent</div><div class="recent-clear" onclick="clearAllRecent()">Clear all</div></div><div class="recent-chips">${recentSearches.map(q=>`<div class="recent-chip" onclick="recentClick('${esc(q)}')">${q}<span class="recent-chip-x" onclick="removeRecent('${esc(q)}',event)">×</span></div>`).join('')}</div></div>`;
  }
  html+=`<div class="trending-section"><div class="section-head" style="padding:0 0 8px"><div class="section-bar"></div><div class="section-title">Trending</div></div><div class="trending-grid" id="trend-grid">${Array(8).fill('<div style="height:52px;border-radius:8px;background:rgba(229,9,20,0.04);border:1px solid rgba(229,9,20,0.07)"></div>').join('')}</div></div>`;
  body.innerHTML=html;
  try{
    const data=await api('/trending/all/day');
    const items=data.results.filter(i=>i.poster_path||i.backdrop_path).slice(0,8);
    const grid=document.getElementById('trend-grid');if(!grid)return;
    grid.innerHTML=items.map((item,idx)=>{
      const t=item.title||item.name||'';
      const sub=item.media_type==='tv'?'TV Show':'Movie';
      const thumb=imgUrl(item.poster_path||item.backdrop_path,'w92');
      const mt=item.media_type||'movie';
      return`<div class="trending-card" onclick="openDetail(${item.id},'${mt}')"><div class="trending-num">${idx+1}</div><div class="trending-info"><div class="trending-title">${t}</div><div class="trending-sub">${sub}</div></div>${thumb?`<img class="trending-thumb" src="${thumb}" alt="${esc(t)}" loading="lazy" onerror="this.style.display='none'"/>`:''}</div>`;
    }).join('');
  }catch(e){const g=document.getElementById('trend-grid');if(g)g.innerHTML=errBox('Failed to load');}
}

async function doSearch(q){
  const body=document.getElementById('search-body');if(!body)return;
  currentFilter='all';allResults=[];
  body.innerHTML=`<div class="results-area"><div class="results-header"><div class="results-title">Searching <b>"${q}"</b></div></div><div class="small-ring"></div></div>`;
  try{
    const[mv,tv]=await Promise.all([api('/search/movie',{query:q}),api('/search/tv',{query:q})]);
    allResults=[...mv.results.map(r=>({...r,_t:'movie'})),...tv.results.map(r=>({...r,_t:'tv'}))].filter(r=>r.poster_path);
    allResults.sort((a,b)=>b.popularity-a.popularity);
    renderResults(q);
  }catch(e){if(body)body.innerHTML=errBox('Search failed');}
}
function renderResults(q){
  const body=document.getElementById('search-body');if(!body)return;
  const filtered=currentFilter==='all'?allResults:allResults.filter(r=>r._t===currentFilter);
  let html=`<div class="results-area"><div class="results-header"><div class="results-title">Results for <b>"${q}"</b></div><div class="results-count">${filtered.length} found</div></div><div class="results-filter"><button class="filter-btn${currentFilter==='all'?' active':''}" onclick="setFilter('all','${esc(q)}')">All (${allResults.length})</button><button class="filter-btn${currentFilter==='movie'?' active':''}" onclick="setFilter('movie','${esc(q)}')">Movies (${allResults.filter(r=>r._t==='movie').length})</button><button class="filter-btn${currentFilter==='tv'?' active':''}" onclick="setFilter('tv','${esc(q)}')">TV (${allResults.filter(r=>r._t==='tv').length})</button></div>`;
  if(!filtered.length){
    html+=`<div class="no-results"><div class="no-results-icon">🎬</div><div class="no-results-text">No results found</div><div class="no-results-sub">Try different keywords</div></div>`;
  }else{
    html+=`<div class="results-grid">${filtered.map(r=>{const t=r.title||r.name||'';const p=imgUrl(r.poster_path,'w342');return`<div class="result-card" onclick="openDetail(${r.id},'${r._t}')"><img src="${p}" alt="${esc(t)}" loading="lazy" onerror="this.parentElement.style.display='none'"/></div>`;}).join('')}</div>`;
  }
  html+='</div>';body.innerHTML=html;
}
function setFilter(type,q){currentFilter=type;renderResults(q);}

/* DETAIL */
async function openDetail(id,type){
  prevView=document.querySelector('.view.active').id;
  const dv=document.getElementById('detail-view');
  showView('detail-view');
  dv.innerHTML=`<button class="detail-back" onclick="closeDetail()">‹</button><div style="display:flex;align-items:center;justify-content:center;height:100dvh"><div class="ring"></div></div>`;
  try{
    const[detail,credits,videos]=await Promise.all([api(`/${type}/${id}`),api(`/${type}/${id}/credits`),api(`/${type}/${id}/videos`)]);
    renderDetail(dv,detail,credits,videos,type);
  }catch(e){dv.innerHTML=`<button class="detail-back" onclick="closeDetail()">‹</button>${errBox('Failed to load')}`;}
}
function renderDetail(dv,detail,credits,videos,type){
  const title=detail.title||detail.name||'';
  const backdrop=imgUrl(detail.backdrop_path,'w780');
  const poster=imgUrl(detail.poster_path,'w342');
  const overview=detail.overview||'No overview available.';
  const tagline=detail.tagline||'';
  const rating=detail.vote_average?detail.vote_average.toFixed(1):'N/A';
  const votes=detail.vote_count?detail.vote_count.toLocaleString():'0';
  const releaseDate=fmtDate(detail.release_date||detail.first_air_date);
  const genres=(detail.genres||[]).map(g=>g.name).join(', ')||'N/A';
  const budget=money(detail.budget);
  const revenue=money(detail.revenue);
  const runtime=detail.runtime?`${detail.runtime} min`:(detail.episode_run_time&&detail.episode_run_time[0]?`${detail.episode_run_time[0]} min/ep`:'N/A');
  const status=detail.status||'N/A';
  const langs=(detail.spoken_languages||[]).map(l=>l.english_name).join(', ')||'N/A';
  const origLang=detail.original_language?detail.original_language.toUpperCase():'N/A';
  const country=(detail.production_countries||[]).map(c=>c.name).join(', ')||'N/A';
  const studio=(detail.production_companies||[]).slice(0,2).map(c=>c.name).join(', ')||'N/A';
  const seasons=detail.number_of_seasons;
  const epTotal=detail.number_of_episodes;
  const validSeasons=(detail.seasons||[]).filter(s=>s.season_number>0);
  const trailer=(videos.results||[]).find(v=>v.type==='Trailer'&&v.site==='YouTube')||(videos.results||[]).find(v=>v.site==='YouTube');
  const cast=(credits.cast||[]).slice(0,16);
  const directors=(credits.crew||[]).filter(c=>c.job==='Director').map(c=>c.name).join(', ')||'N/A';
  const writers=(credits.crew||[]).filter(c=>c.department==='Writing').slice(0,3).map(c=>c.name).join(', ')||'N/A';
  const tRows=[
    ['Release',releaseDate],['Genre',genres],
    ['Rating',`${ICONS.star} ${rating}/10 (${votes} votes)`],
    ['Status',status],['Runtime',runtime],['Language',langs],
    ['Orig. Lang',origLang],['Country',country],['Studio',studio],
    ...(type==='movie'?[['Director',directors],['Writer',writers],['Budget',budget],['Revenue',revenue]]:[]),
    ...(seasons?[['Seasons',`${seasons}`]]:[]),
    ...(epTotal?[['Episodes',`${epTotal}`]]:[]),
  ];
  const trailerSection=trailer
    ?`<div class="detail-trailer-top"><iframe src="https://www.youtube.com/embed/${trailer.key}?rel=0&modestbranding=1&playsinline=1&autoplay=0" allowfullscreen allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture"></iframe></div>`
    :backdrop
    ?`<div class="detail-trailer-top" style="position:relative;overflow:hidden"><div class="detail-trailer-fallback" style="background-image:url(${backdrop})"></div><div class="detail-trailer-fallback-grad"></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">${ICONS.noplay}<span style="font-size:11px;color:rgba(255,255,255,0.28)">No trailer available</span></div></div>`
    :`<div class="detail-trailer-top" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px">${ICONS.noplay}<span style="font-size:11px;color:rgba(255,255,255,0.28)">No trailer available</span></div>`;
  dv.innerHTML=`
    <button class="detail-back" onclick="closeDetail()">‹</button>
    ${trailerSection}
    <div class="detail-body">
      <div class="dprow">
        ${poster?`<div class="dposter"><img src="${poster}" alt="${esc(title)}" onerror="this.style.display='none'"/></div>`:''}
        <div class="dpinfo">
          <div class="dbadges"><span class="badge-r">${type==='tv'?'TV Show':'Movie'}</span><span class="badge-o">${ICONS.star} ${rating}</span></div>
          <div class="dtitle" onclick="copyTitle('${esc(title)}')">${title} <span style="display:inline-flex;margin-left:4px;vertical-align:middle;opacity:0.35">${ICONS.copy}</span></div>
          ${tagline?`<div class="dtagline">"${tagline}"</div>`:''}
          <div class="ddate">${ICONS.cal} ${releaseDate}</div>
        </div>
      </div>
      <div class="doverview">${overview}</div>
      <div class="sec-lbl">Details<div class="sec-lbl-line"></div></div>
      <table class="info-tbl"><tbody>${tRows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>
      ${buildWebSearcher(title,type)}
      ${cast.length?`
        <div class="sec-lbl">Cast<div class="sec-lbl-line"></div></div>
        <div class="cast-row">${cast.map(a=>{const ph=imgUrl(a.profile_path,'w185');return`<div class="cast-item"><div class="cast-avatar"><img src="${ph||noAvatar}" alt="${esc(a.name)}" loading="lazy" onerror="this.src='${noAvatar}'"/></div><div class="cast-name">${a.name}</div><div class="cast-char">${(a.character||'').substring(0,20)}</div></div>`;}).join('')}</div>`:''}
      ${type==='tv'&&validSeasons.length?`
        <div class="sec-lbl">Episodes<div class="sec-lbl-line"></div></div>
        <div class="season-sel" id="season-sel">${validSeasons.map((s,i)=>`<button class="season-btn${i===0?' active':''}" onclick="loadSeason(${detail.id},${s.season_number},this)">Season ${s.season_number}</button>`).join('')}</div>
        <div class="ep-list" id="ep-list"><div class="small-ring"></div></div>`:''}
    </div>`;
  if(type==='tv'&&validSeasons.length)loadSeason(detail.id,validSeasons[0].season_number,null);
}

async function loadSeason(showId,seasonNum,btnEl){
  if(btnEl){document.querySelectorAll('.season-btn').forEach(b=>b.classList.remove('active'));btnEl.classList.add('active');}
  const list=document.getElementById('ep-list');if(!list)return;
  list.innerHTML='<div class="small-ring"></div>';
  try{
    const data=await api(`/tv/${showId}/season/${seasonNum}`);
    const eps=data.episodes||[];
    if(!eps.length){list.innerHTML=errBox('No episodes found');return;}
    list.innerHTML=eps.map(ep=>{
      const thumb=imgUrl(ep.still_path,'w300');
      const airDate=fmtDate(ep.air_date);
      const epRt=ep.vote_average?ep.vote_average.toFixed(1):'';
      const epRuntime=ep.runtime?`${ep.runtime}m`:'';
      return`<div class="ep-card"><div class="ep-num">E${ep.episode_number}</div><div class="ep-info"><div class="ep-title">${ep.name||`Episode ${ep.episode_number}`}</div><div class="ep-meta"><span class="ep-date">${ICONS.cal} ${airDate}</span>${epRt?`<span class="ep-rating">${ICONS.star}${epRt}</span>`:''} ${epRuntime?`<span class="ep-rt">${epRuntime}</span>`:''}</div>${ep.overview?`<div class="ep-ov">${ep.overview}</div>`:''}</div><img class="ep-thumb" src="${thumb||noThumb}" alt="E${ep.episode_number}" loading="lazy" onerror="this.src='${noThumb}'"/></div>`;
    }).join('');
  }catch(e){if(list)list.innerHTML=errBox('Failed to load episodes');}
}

function closeDetail(){showView(prevView||'home-view');}

/* INIT */
async function init(){
  await buildHomeView();
  document.getElementById('global-loading').style.display='none';
}
init();
</script>
