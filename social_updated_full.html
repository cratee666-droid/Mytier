function start(){if(unsubs.length)return;unsubs.push(onValue(ref(db,'profiles'),s=>{profiles=s.val()||{};render()}));unsubs.push(onValue(query(ref(db,'posts'),limitToLast(150)),s=>{posts=s.val()||{};render()}));unsubs.push(onValue(ref(db,'following/'+uid),s=>{following=s.val()||{};render()}))}function go(t){tab=t;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(t).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}function render(){if(!uid)return;if(tab==='home')renderHome();if(tab==='messages')renderMessages();if(tab==='search')renderSearch();if(tab==='profile')renderProfile(uid)}
function arr(fn){return Object.entries(posts).map(([id,p])=>({id,...p})).filter(fn).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}function renderHome(){const a=arr(p=>following[p.uid]);$('homeBody').innerHTML=a.length?a.map(postHTML).join(''):'<div class="empty card">Follow users to see posts here.</div>';a.forEach(p=>bindPost(p.id))}function mediaHTML(m){return `<div class="media" data-act="detail" data-media='${JSON.stringify(m).replace(/'/g,"&#39;")}'><img src="${img(m.poster,'w185')}"><div><b>${esc(m.title)}</b><em>${m.type==='tv'?'TV Show':'Movie'}</em><p>${esc(m.overview||'')}</p></div></div>`}function postHTML(p){const m=p.media;return `<article class="post card"><div class="postHead"><img class="av" src="${av(p.uid)}" data-act="profile" data-uid="${p.uid}"><div class="rowInfo" data-act="profile" data-uid="${p.uid}"><b>${esc(nm(p.uid))}</b><span>@${esc(un(p.uid))} · ${ago(p.createdAt)}</span></div></div>${p.text?`<div class="postText">${esc(p.text)}</div>`:''}${m?mediaHTML(m):''}<div class="actions"><button data-act="react" data-id="${p.id}" data-v="1">${ico.like}<span id="l-${p.id}">0</span></button><button data-act="react" data-id="${p.id}" data-v="-1">${ico.dislike}<span id="d-${p.id}">0</span></button><button data-act="comments" data-id="${p.id}">${ico.comment}<span id="c-${p.id}">0</span></button></div><div class="comments" id="com-${p.id}"><div id="cl-${p.id}"></div><div class="commentRow"><input class="input" id="ci-${p.id}" placeholder="Add comment..."><button data-act="addComment" data-id="${p.id}">${ico.send}</button></div></div></article>`}function bindPost(id){onValue(ref(db,'reactions/'+id),s=>{const r=s.val()||{};let l=0,d=0;Object.values(r).forEach(v=>v===1?l++:v===-1?d++:0);if($('l-'+id))$('l-'+id).textContent=l;if($('d-'+id))$('d-'+id).textContent=d});onValue(ref(db,'comments/'+id),s=>{const c=s.val()||{};if($('c-'+id))$('c-'+id).textContent=Object.keys(c).length;if($('cl-'+id))$('cl-'+id).innerHTML=Object.values(c).map(x=>`<div class="comment"><b>${esc(nm(x.uid))}</b><div>${esc(x.text)}</div></div>`).join('')})}
async function renderProfile(u){tab='profile';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==='profile'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('profile').classList.add('active');const p=profiles[u]||{},mine=u===uid,[fs,fg,ps]=await Promise.all([get(ref(db,'followers/'+u)),get(ref(db,'following/'+u)),get(ref(db,'picks/'+u))]);const followers=fs.val()||{},follows=fg.val()||{},picks=ps.val()||{},a=arr(x=>x.uid===u);$('profileBody').innerHTML=`<div class="profile card"><div class="profileTop"><img class="profilePic" src="${p.photo||noPic}"><div><h2>${esc(p.displayName||'User')}</h2><p>@${esc(p.username||u)}</p><div class="stats"><span><b>${a.length}</b>Posts</span><span data-act="followList" data-type="followers" data-uid="${u}"><b>${Object.keys(followers).length}</b>Followers</span><span data-act="followList" data-type="following" data-uid="${u}"><b>${Object.keys(follows).length}</b>Following</span></div></div>${mine?`<button class="plus" data-act="create">${ico.plus}</button>`:''}</div>${p.bio?`<div class="bio">${esc(p.bio)}</div>`:''}${links(p.links)}<div class="profileBtns">${mine?`<button class="btn" data-act="edit">${ico.edit} Edit</button><button class="btn danger" data-act="logout">Logout</button>`:`<button class="btn" data-act="follow" data-uid="${u}">${followers[uid]?'Following':'Follow'}</button><button class="btn alt" data-act="chat" data-uid="${u}">Message</button>`}</div></div><div class="sectionTitle"><span>Picks</span>${Object.keys(picks).length?`<button data-act="allPicks" data-uid="${u}">View all</button>`:''}</div><div class="picks">${Object.entries(picks).map(([id,pk])=>pickBubble(u,id,pk)).join('')||'<span class="authSub">No picks yet</span>'}</div><div class="sectionTitle"><span>Posts</span></div>${a.length?a.map(postHTML).join(''):'<div class="empty card">No posts</div>'}`;a.forEach(x=>bindPost(x.id))}function links(a=[]){return Array.isArray(a)&&a.length?`<div class="links">${a.map(x=>{let h=/^https?:\/\//i.test(x)?x:'https://'+x;return `<a href="${esc(h)}" target="_blank">${esc(x.replace(/^https?:\/\//,'').split('/')[0])}</a>`}).join('')}</div>`:''}function pickBubble(u,id,pk){const f=Object.values(pk.items||{})[0];return `<div class="pick" data-act="openPick" data-uid="${u}" data-id="${id}"><div class="pickRing">${f?.poster?`<img src="${img(f.poster,'w185')}">`:'+'}</div><span>${esc(pk.title||'Pick')}</span></div>`}
function renderMessages(){$('messagesBody').innerHTML='<div class="sectionTitle"><span>Chats</span></div><div id="chats"></div>';onValue(ref(db,'chats/'+uid),s=>{const c=s.val()||{};$('chats').innerHTML=Object.entries(c).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).map(([u,x])=>`<div class="row" data-act="chat" data-uid="${u}"><img class="av" src="${av(u)}"><div class="rowInfo"><b>${esc(nm(u))}</b><span>${esc(x.last||'')}</span></div></div>`).join('')||'<div class="empty card">No chats. Search profiles and message them.</div>'})}function renderSearch(){$('searchBody').innerHTML='<input class="input" id="searchInput" placeholder="Search profiles..."><div id="results"></div>'}function searchUsers(q){q=q.trim().toLowerCase();const a=Object.entries(profiles).filter(([u,p])=>u!==uid&&((p.username||'').toLowerCase().includes(q)||(p.displayName||'').toLowerCase().includes(q))).slice(0,40);$('results').innerHTML=q?(a.map(([u,p])=>`<div class="row"><img class="av" src="${p.photo||noPic}"><div class="rowInfo" data-act="profile" data-uid="${u}"><b>${esc(p.displayName||'User')}</b><span>@${esc(p.username||u)}</span></div><button class="btn" data-act="chat" data-uid="${u}">Message</button></div>`).join('')||'<div class="empty card">No users</div>'):''}
function chatId(a,b){return [a,b].sort().join('_')}function openChat(u){chatWith=u;$('modal').innerHTML=`<div class="chat"><div class="chatTop"><button class="back" data-act="closeChat">‹</button><img class="av" src="${av(u)}"><div class="rowInfo"><b>${esc(nm(u))}</b><span>@${esc(un(u))}</span></div></div><div class="chatList" id="chatList"></div><div class="chatPick" id="chatPick"></div><div class="chatInput"><button data-act="media" data-target="chat">${ico.film}</button><input class="input" id="msgInput" placeholder="Message..."><button data-act="sendMsg">${ico.send}</button></div></div>`;if(chatUnsub)chatUnsub();chatUnsub=onValue(ref(db,'messages/'+chatId(uid,u)),s=>{const m=Object.values(s.val()||{}).sort((a,b)=>(a.ts||0)-(b.ts||0));$('chatList').innerHTML=m.map(msgHTML).join('');$('chatList').scrollTop=$('chatList').scrollHeight})}function msgHTML(m){return `<div class="msg ${m.from===uid?'me':''}">${m.text?esc(m.text):''}${m.media?`<div class="msgMedia" data-act="detail" data-media='${JSON.stringify(m.media).replace(/'/g,"&#39;")}'><img src="${img(m.media.poster,'w185')}"><div><b>${esc(m.media.title)}</b><span>${esc(m.media.type)}</span></div></div>`:''}</div>`}async function writeMsg(payload,last){if(!chatWith)return;const id=chatId(uid,chatWith),ts=Date.now();await push(ref(db,'messages/'+id),{from:uid,to:chatWith,ts,...payload});await set(ref(db,'chats/'+uid+'/'+chatWith),{last,ts});await set(ref(db,'chats/'+chatWith+'/'+uid),{last,ts})}
function sheet(html){$('modal').innerHTML=`<div class="sheet"><div class="sheetBox">${html}</div></div>`}function openCreate(){sheet(`<h3>Create</h3><button class="btn" data-act="post">${ico.plus} New Post</button><button class="btn alt" data-act="pickCreate">${ico.plus} New Pick</button><button class="btn alt" data-act="close">Cancel</button>`)}function openPost(){draftMedia=null;sheet(`<h3>New Post</h3><textarea class="input" id="postText" placeholder="Write a post..." style="height:90px"></textarea><div id="selectedMedia"></div><button class="btn alt" data-act="media" data-target="post">${ico.film} Pick title</button><button class="btn" data-act="createPost">${ico.send} Post</button><button class="btn alt" data-act="close">Cancel</button>`)}
function openMedia(target){mediaTarget=target;mediaType='movie';const html=`<div class="sheet"><div class="sheetBox"><h3>Choose title</h3><div class="mode" id="modeText">Currently choosing: Movies</div><div class="tabs"><button class="tab active" data-act="mediaType" data-type="movie">Movies</button><button class="tab" data-act="mediaType" data-type="tv">TV Shows</button></div><input class="input" id="mediaQuery" placeholder="Search movies..."><div id="mediaResults"><div class="empty">Type to search movies</div></div><button class="btn alt" data-act="${target==='chat'?'closeChatPick':'close'}">Cancel</button></div></div>`;if(target==='chat')$('chatPick').innerHTML=html;else $('modal').innerHTML=html}async function api(ep,params={}){const u=new URL(TMDB+ep);u.searchParams.set('api_key',TMDB_KEY);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return (await fetch(u)).json()}async function searchMedia(q){q=q.trim();if(!q)return;const type=mediaType;$('mediaResults').innerHTML=`<div class="empty">Searching...</div>`;const d=await api('/search/'+type,{query:q});if(type!==mediaType)return;$('mediaResults').innerHTML=(d.results||[]).slice(0,15).map(x=>{const title=x.title||x.name||'Untitled',poster=x.poster_path||'',ov=x.overview||'';return `<div class="result" data-act="chooseMedia" data-id="${x.id}" data-type="${type}" data-title="${encodeURIComponent(title)}" data-poster="${encodeURIComponent(poster)}" data-overview="${encodeURIComponent(ov)}"><img src="${img(poster,'w92')}"><div class="rowInfo"><b>${esc(title)}</b><span>${type==='movie'?'Movie':'TV Show'}</span></div><button class="btn">Choose</button></div>`}).join('')||'<div class="empty">No results</div>'}async function chooseMedia(el){const m={id:el.dataset.id,type:el.dataset.type,title:decodeURIComponent(el.dataset.title),poster:decodeURIComponent(el.dataset.poster),overview:decodeURIComponent(el.dataset.overview)};if(!confirm(`Choose this ${m.type==='movie'?'movie':'TV show'}?`))return;if(mediaTarget==='chat'){await writeMsg({text:m.title,media:m},`Sent ${m.type}: ${m.title}`);$('chatPick').innerHTML='';return}if(mediaTarget==='pick'){pickItems.push(m);renderPickCreate();return}draftMedia=m;openPost();$('selectedMedia').innerHTML=mediaHTML(m)}
function renderPickCreate(){sheet(`<h3>New Pick</h3><input class="input" id="pickTitle" placeholder="Pick title" value="${esc(pickTitle)}"><button class="btn alt" data-act="media" data-target="pick">${ico.film} Add title</button><div>${pickItems.map(x=>`<span class="chip">${esc(x.title)}</span>`).join('')}</div><button class="btn" data-act="savePick">Save Pick</button><button class="btn alt" data-act="close">Cancel</button>`)}async function savePick(){pickTitle=$('pickTitle')?.value||pickTitle;if(!pickItems.length)return toast('Add titles');const items={};pickItems.forEach((x,i)=>items['i'+i]={...x,order:i});await push(ref(db,'picks/'+uid),{title:(pickTitle||'Pick').trim(),items,createdAt:Date.now()});pickItems=[];pickTitle='';$('modal').innerHTML='';renderProfile(uid)}
async function openPick(u,id){const s=await get(ref(db,'picks/'+u)),p=s.val()||{};pickSet=Object.entries(p).map(([pid,pk])=>({id:pid,...pk}));pickIdx=Math.max(0,pickSet.findIndex(x=>x.id===id));itemIdx=0;viewer()}function viewer(){const pk=pickSet[pickIdx];if(!pk)return;const items=Object.values(pk.items||{}).sort((a,b)=>(a.order||0)-(b.order||0)),it=items[itemIdx]||items[0];if(!it)return;$('modal').innerHTML=`<div class="viewer"><div class="bars">${items.map((_,i)=>`<span class="${i===itemIdx?'active':''}"></span>`).join('')}</div><button class="btn viewAllV" data-act="viewPickItems">View all</button><button class="back closeV" data-act="close">×</button><div class="tap left" data-act="pickPrev"></div><div class="tap right" data-act="pickNext"></div><img src="${img(it.poster,'original')}" data-act="detail" data-media='${JSON.stringify(it).replace(/'/g,"&#39;")}'><div class="shade"></div><div class="vInfo" data-act="detail" data-media='${JSON.stringify(it).replace(/'/g,"&#39;")}'><em>${esc(it.type)}</em><h2>${esc(it.title)}</h2><p>${esc(pk.title||'Pick')} · tap for details</p></div></div>`}
function viewPickItems(){const pk=pickSet[pickIdx],items=Object.values(pk.items||{}).sort((a,b)=>(a.order||0)-(b.order||0));$('modal').innerHTML=`<div class="full"><div class="fullTop"><button class="back" data-act="viewer">‹</button><b>${esc(pk.title||'Pick')}</b></div><div class="fullList">${items.map(it=>`<div class="row" data-act="detail" data-media='${JSON.stringify(it).replace(/'/g,"&#39;")}'><img class="av" style="border-radius:8px;width:44px;height:64px" src="${img(it.poster,'w185')}"><div class="rowInfo"><b>${esc(it.title)}</b><span>${esc(it.type)}</span></div></div>`).join('')}</div></div>`}
function fullList(title,ids){$('modal').innerHTML=`<div class="full"><div class="fullTop"><button class="back" data-act="close">‹</button><b>${title}</b></div><div class="fullList">${ids.map(id=>`<div class="row" data-act="profile" data-uid="${id}"><img class="av" src="${av(id)}"><div class="rowInfo"><b>${esc(nm(id))}</b><span>@${esc(un(id))}</span></div></div>`).join('')||'<div class="empty card">No users</div>'}</div></div>`}
async function editProfile(){const p=profiles[uid]||{};sheet(`<h3>Edit Profile</h3><input class="input" id="eName" value="${esc(p.displayName||'')}" placeholder="Display name"><input class="input" id="eUser" value="${esc(p.username||'')}" placeholder="Username"><input class="input" id="ePhoto" value="${esc(p.photo||'')}" placeholder="Photo URL"><textarea class="input" id="eBio" style="height:82px" placeholder="Bio">${esc(p.bio||'')}</textarea><textarea class="input" id="eLinks" style="height:92px" placeholder="Any links, one per line">${esc((p.links||[]).join('\n'))}</textarea><button class="btn" data-act="saveProfile">Save</button><button class="btn alt" data-act="close">Cancel</button>`)}async function saveProfile(){const username=clean($('eUser').value),cur=profiles[uid]?.username;if(username!==cur){const taken=await get(ref(db,'usernames/'+username));if(taken.exists())return toast('Username taken');if(cur)await remove(ref(db,'usernames/'+cur));await set(ref(db,'usernames/'+username),uid);await update(ref(db,'authUsers/'+uid),{username})}await update(ref(db,'profiles/'+uid),{uid,displayName:$('eName').value.trim()||'User',username,photo:$('ePhoto').value.trim(),bio:$('eBio').value.trim(),links:$('eLinks').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,10),updatedAt:Date.now()});$('modal').innerHTML='';renderProfile(uid)}
async function handle(act,el){if(act==='theme')return theme();if(act==='submitAuth')return submitAuth();if(el.dataset.tab)return go(el.dataset.tab);if(el.dataset.auth){authMode=el.dataset.auth;return paintAuth()}if(act==='profile')return renderProfile(el.dataset.uid);if(act==='react')return set(ref(db,'reactions/'+el.dataset.id+'/'+uid),Number(el.dataset.v));if(act==='comments')return $('com-'+el.dataset.id).classList.toggle('show');if(act==='addComment'){const i=$('ci-'+el.dataset.id),text=i.value.trim();if(text){await push(ref(db,'comments/'+el.dataset.id),{uid,text,createdAt:Date.now()});i.value=''}return}if(act==='create')return openCreate();if(act==='post')return openPost();if(act==='createPost'){const text=$('postText')?.value.trim()||'';if(!text&&!draftMedia)return toast('Write or pick title');await push(ref(db,'posts'),{uid,text,media:draftMedia,createdAt:Date.now()});draftMedia=null;$('modal').innerHTML='';return renderProfile(uid)}if(act==='media')return openMedia(el.dataset.target);if(act==='mediaType'){mediaType=el.dataset.type;document.querySelectorAll('[data-act="mediaType"]').forEach(b=>b.classList.toggle('active',b.dataset.type===mediaType));$('modeText').textContent='Currently choosing: '+(mediaType==='movie'?'Movies':'TV Shows');$('mediaQuery').placeholder=mediaType==='movie'?'Search movies...':'Search TV shows...';$('mediaResults').innerHTML='<div class="empty">Type to search '+(mediaType==='movie'?'movies':'TV shows')+'</div>';return}if(act==='chooseMedia')return chooseMedia(el);if(act==='close')return $('modal').innerHTML='';if(act==='closeChat')return $('modal').innerHTML='';if(act==='closeChatPick')return $('chatPick').innerHTML='';if(act==='chat')return openChat(el.dataset.uid);if(act==='sendMsg'){const i=$('msgInput'),text=i.value.trim();if(text){await writeMsg({text},text);i.value=''}return}if(act==='detail')return detail(JSON.parse(el.dataset.media));if(act==='pickCreate'){pickItems=[];pickTitle='';return renderPickCreate()}if(act==='savePick')return savePick();if(act==='openPick')return openPick(el.dataset.uid,el.dataset.id);if(act==='allPicks'){const s=await get(ref(db,'picks/'+el.dataset.uid)),p=s.val()||{};$('modal').innerHTML=`<div class="full"><div class="fullTop"><button class="back" data-act="close">‹</button><b>All Picks</b></div><div class="fullList">${Object.entries(p).map(([id,pk])=>`<div class="row" data-act="openPick" data-uid="${el.dataset.uid}" data-id="${id}"><div class="pickRing" style="width:48px;height:48px;flex:0 0 48px">+</div><div class="rowInfo"><b>${esc(pk.title||'Pick')}</b><span>${Object.keys(pk.items||{}).length} titles</span></div></div>`).join('')||'<div class="empty card">No picks</div>'}</div></div>`;return}if(act==='pickNext'){const items=Object.values(pickSet[pickIdx].items||{});if(itemIdx<items.length-1)itemIdx++;else if(pickIdx<pickSet.length-1){pickIdx++;itemIdx=0}else{$('modal').innerHTML='';return}return viewer()}if(act==='pickPrev'){if(itemIdx>0)itemIdx--;else if(pickIdx>0){pickIdx--;itemIdx=Math.max(0,Object.values(pickSet[pickIdx].items||{}).length-1)}return viewer()}if(act==='viewer')return viewer();if(act==='viewPickItems')return viewPickItems();if(act==='follow'){const u=el.dataset.uid,s=await get(ref(db,'followers/'+u+'/'+uid));if(s.exists()){await remove(ref(db,'followers/'+u+'/'+uid));await remove(ref(db,'following/'+uid+'/'+u))}else{await set(ref(db,'followers/'+u+'/'+uid),true);await set(ref(db,'following/'+uid+'/'+u),true)}return renderProfile(u)}if(act==='followList'){const s=await get(ref(db,el.dataset.type+'/'+el.dataset.uid));return fullList(el.dataset.type==='followers'?'Followers':'Following',Object.keys(s.val()||{}))}if(act==='edit')return editProfile();if(act==='saveProfile')return saveProfile();if(act==='logout'){localStorage.removeItem('cine_uid');localStorage.removeItem('rosho_uid');location.reload();}}
['click','touchend','pointerup'].forEach(ev=>document.addEventListener(ev,e=>{const el=e.target.closest('[data-act],[data-tab],[data-auth]');if(!el)return;e.preventDefault();e.stopPropagation();handle(el.dataset.act,el)}, {capture:true,passive:false}));document.addEventListener('input',e=>{if(e.target.id==='searchInput')searchUsers(e.target.value);if(e.target.id==='mediaQuery')searchMedia(e.target.value);if(e.target.id==='pickTitle')pickTitle=e.target.value});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msgInput'){e.preventDefault();handle('sendMsg',e.target)}});document.addEventListener('touchstart',e=>{if(e.target.closest('.viewer'))swipeX=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(!e.target.closest('.viewer'))return;const dx=e.changedTouches[0].clientX-swipeX;if(Math.abs(dx)>70){if(dx<0)handle('pickNext',e.target);else handle('pickPrev',e.target)}},{passive:true});
if(uid)login(uid);else $('auth').classList.add('show');
</script>
