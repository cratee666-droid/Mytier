function applyTheme(t){const n=t==='dark'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('cine_theme',n);['themeBtn','themeBtn2'].forEach(id=>{if($(id))$(id).textContent=n==='dark'?'☀':'☾'});document.querySelector('meta[name="theme-color"]').content=n==='dark'?'#0d0f14':'#f8f4ec'}window.toggleTheme=()=>applyTheme((document.documentElement.dataset.theme||'light')==='dark'?'light':'dark');applyTheme(localStorage.getItem('cine_theme')||((matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}window.paintAuth=()=>{$('loginTab').classList.toggle('active',authMode==='login');$('signupTab').classList.toggle('active',authMode==='signup');$('authName').style.display=authMode==='signup'?'block':'none';$('authBtn').textContent=authMode==='signup'?'Create account':'Login'};window.submitAuth=async()=>{const user=clean($('authUser').value),pass=$('authPass').value;if(user.length<3)return toast('Username min 3');if(pass.length<4)return toast('Password min 4');const map=await get(ref(db,'usernames/'+user));if(authMode==='signup'){if(map.exists())return toast('Username taken');const id='u_'+Math.random().toString(36).slice(2,14),h=await hash(pass),displayName=$('authName').value.trim()||user;await set(ref(db,'authUsers/'+id),{uid:id,username:user,passHash:h,createdAt:Date.now()});await set(ref(db,'usernames/'+user),id);await set(ref(db,'profiles/'+id),{uid:id,username:user,displayName,photo:'',bio:'',links:[],createdAt:Date.now()});login(id)}else{if(!map.exists())return toast('User not found');const id=map.val(),snap=await get(ref(db,'authUsers/'+id));if(!snap.exists()||snap.val().passHash!==await hash(pass))return toast('Wrong password');login(id)}};function login(id){uid=id;localStorage.setItem('cine_uid',id);localStorage.setItem('rosho_uid',id);$('auth').classList.remove('show');start();go('home')}

function postArray(fn){return Object.entries(posts).map(([id,p])=>({id,...p})).filter(fn).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}function renderHome(){const arr=postArray(p=>following[p.uid]);$('homeBody').innerHTML=arr.length?arr.map(postHTML).join(''):'<div class="empty card">Follow users to see their posts here.</div>';arr.forEach(p=>bindPost(p.id))}function postHTML(p){const m=p.media;return `<article class="post card"><div class="postHead"><img class="avatar" src="${av(p.uid)}" onclick="openProfile('${p.uid}')"><div class="who" onclick="openProfile('${p.uid}')"><b>${esc(nm(p.uid))}</b><span>@${esc(un(p.uid))} · ${ago(p.createdAt)}</span></div></div>${p.text?`<div class="postText">${esc(p.text)}</div>`:''}${m?mediaHTML(m):''}<div class="actions"><button id="l-${p.id}" onclick="react('${p.id}',1)">${I.like}<span>0</span></button><button id="d-${p.id}" onclick="react('${p.id}',-1)">${I.dislike}<span>0</span></button><button onclick="toggleComments('${p.id}')">${I.comment}<span id="c-${p.id}">0</span></button></div><div class="comments" id="com-${p.id}"><div id="cl-${p.id}"></div><div class="commentRow"><input class="input" id="ci-${p.id}" placeholder="Add comment..."><button onclick="addComment('${p.id}')">${I.send}</button></div></div></article>`}function mediaHTML(m){return `<div class="mediaCard" onclick='detail(${JSON.stringify(m).replace(/'/g,"&#39;")})'><img src="${img(m.poster,'w185')}"><div><b>${esc(m.title)}</b><em>${esc(m.type==='tv'?'TV Show':'Movie')}</em><p>${esc(m.overview||'')}</p></div></div>`}
function bindPost(id){onValue(ref(db,'reactions/'+id),s=>{const r=s.val()||{};let l=0,d=0;Object.values(r).forEach(v=>v===1?l++:v===-1?d++:0);if($('l-'+id))$('l-'+id).querySelector('span').textContent=l;if($('d-'+id))$('d-'+id).querySelector('span').textContent=d});onValue(ref(db,'comments/'+id),s=>{const c=s.val()||{};if($('c-'+id))$('c-'+id).textContent=Object.keys(c).length;if($('cl-'+id))$('cl-'+id).innerHTML=Object.values(c).map(x=>`<div class="comment"><b>${esc(nm(x.uid))}</b><div>${esc(x.text)}</div></div>`).join('')})}window.react=(id,v)=>set(ref(db,'reactions/'+id+'/'+uid),v);window.toggleComments=id=>$('com-'+id).classList.toggle('show');window.addComment=async id=>{const i=$('ci-'+id),text=i.value.trim();if(!text)return;await push(ref(db,'comments/'+id),{uid,text,createdAt:Date.now()});i.value=''};
window.openProfile=u=>{tab='profile';go('profile');renderProfile(u)};async function renderProfile(u){const p=profiles[u]||{},mine=u===uid,[fs,fg,ps]=await Promise.all([get(ref(db,'followers/'+u)),get(ref(db,'following/'+u)),get(ref(db,'picks/'+u))]);const followers=fs.val()||{},follows=fg.val()||{},picks=ps.val()||{},arr=postArray(x=>x.uid===u);$('profileBody').innerHTML=`<div class="profile card"><div class="profileTop"><img class="profilePic" src="${p.photo||noPic}"><div><h2>${esc(p.displayName||'User')}</h2><p>@${esc(p.username||u)}</p><div class="stats"><span><b>${arr.length}</b>Posts</span><span onclick="showFollow('${u}','followers')"><b>${Object.keys(followers).length}</b>Followers</span><span onclick="showFollow('${u}','following')"><b>${Object.keys(follows).length}</b>Following</span></div></div>${mine?`<button class="plus" onclick="openCreate()">${I.plus}</button>`:''}</div>${p.bio?`<div class="bio">${esc(p.bio)}</div>`:''}${links(p.links)}<div class="profileBtns">${mine?`<button class="btn" onclick="editProfile()">${I.edit} Edit</button><button class="btn danger" onclick="logout()">${I.out} Logout</button>`:`<button class="btn" onclick="followUser('${u}')">${followers[uid]?'Following':'Follow'}</button><button class="btn secondary" onclick="openChat('${u}')">Message</button>`}</div></div><div class="sectionTitle"><span>Picks</span>${Object.keys(picks).length?`<button onclick="viewAllPicks('${u}')">View all</button>`:''}</div><div class="picks">${Object.entries(picks).map(([id,pk])=>pickBubble(u,id,pk)).join('')||'<span class="hint">No picks yet</span>'}</div><div class="sectionTitle"><span>Posts</span></div>${arr.length?arr.map(postHTML).join(''):'<div class="empty card">No posts</div>'}`;arr.forEach(x=>bindPost(x.id))}function links(a=[]){return Array.isArray(a)&&a.length?`<div class="links">${a.map(x=>{let h=/^https?:\/\//i.test(x)?x:'https://'+x;return `<a href="${esc(h)}" target="_blank">${esc(x.replace(/^https?:\/\//,'').split('/')[0])}</a>`}).join('')}</div>`:''}function pickBubble(u,id,pk){const f=Object.values(pk.items||{})[0];return `<div class="pick" onclick="openPick('${u}','${id}')"><div class="pickRing">${f?.poster?`<img src="${img(f.poster,'w185')}">`:'+'}</div><span>${esc(pk.title||'Pick')}</span></div>`}window.logout=()=>{localStorage.removeItem('cine_uid');localStorage.removeItem('rosho_uid');location.reload()};window.followUser=async u=>{const s=await get(ref(db,'followers/'+u+'/'+uid));if(s.exists()){await remove(ref(db,'followers/'+u+'/'+uid));await remove(ref(db,'following/'+uid+'/'+u))}else{await set(ref(db,'followers/'+u+'/'+uid),true);await set(ref(db,'following/'+uid+'/'+u),true)}renderProfile(u)};
function renderMessages(){$('messagesBody').innerHTML='<div class="sectionTitle"><span>Chats</span></div><div id="chats"></div>';onValue(ref(db,'chats/'+uid),s=>{const c=s.val()||{};$('chats').innerHTML=Object.entries(c).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).map(([u,x])=>`<div class="userRow" onclick="openChat('${u}')"><img class="avatar" src="${av(u)}"><div><b>${esc(nm(u))}</b><span>${esc(x.last||'')}</span></div></div>`).join('')||'<div class="empty card">No chats yet. Find users in Search and open their profile to message.</div>'})}function renderSearch(){$('searchBody').innerHTML='<input class="input" placeholder="Search profiles..." oninput="searchUsers(this.value)"><div id="results"></div>'}window.searchUsers=q=>{q=q.trim().toLowerCase();const arr=Object.entries(profiles).filter(([u,p])=>u!==uid&&((p.username||'').toLowerCase().includes(q)||(p.displayName||'').toLowerCase().includes(q))).slice(0,40);$('results').innerHTML=q?(arr.map(([u,p])=>`<div class="userRow"><img class="avatar" src="${p.photo||noPic}"><div onclick="openProfile('${u}')"><b>${esc(p.displayName||'User')}</b><span>@${esc(p.username||u)}</span></div><button class="btn" onclick="openChat('${u}')">Message</button></div>`).join('')||'<div class="empty card">No users found</div>'):''};
function chatId(a,b){return [a,b].sort().join('_')}window.openChat=u=>{chatWith=u;$('modal').innerHTML=`<div class="chat"><div class="chatTop"><button class="back" onclick="closeChat()">‹</button><img class="avatar" src="${av(u)}"><div class="who"><b>${esc(nm(u))}</b><span>@${esc(un(u))}</span></div></div><div class="chatList" id="chatList"></div><div class="chatPick" id="chatPick"></div><div class="chatInput"><button onclick="openMedia('chat')">${I.film}</button><input class="input" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">${I.send}</button></div></div>`;if(chatUnsub)chatUnsub();chatUnsub=onValue(ref(db,'messages/'+chatId(uid,u)),s=>{const msgs=Object.values(s.val()||{}).sort((a,b)=>(a.ts||0)-(b.ts||0));$('chatList').innerHTML=msgs.map(msgHTML).join('');$('chatList').scrollTop=$('chatList').scrollHeight})};window.closeChat=()=>{$('modal').innerHTML='';if(chatUnsub)chatUnsub()};function msgHTML(m){return `<div class="msg ${m.from===uid?'me':''}">${m.text?esc(m.text):''}${m.media?`<div class="msgMedia" onclick='detail(${JSON.stringify(m.media).replace(/'/g,"&#39;")})'><img src="${img(m.media.poster,'w185')}"><div><b>${esc(m.media.title)}</b><span>${esc(m.media.type)}</span></div></div>`:''}</div>`}async function writeMsg(payload,last){if(!chatWith)return;const id=chatId(uid,chatWith),ts=Date.now();await push(ref(db,'messages/'+id),{from:uid,to:chatWith,ts,...payload});await set(ref(db,'chats/'+uid+'/'+chatWith),{last,ts});await set(ref(db,'chats/'+chatWith+'/'+uid),{last,ts})}window.sendMsg=async()=>{const i=$('msgInput'),text=i.value.trim();if(!text)return;await writeMsg({text},text);i.value=''};
function modalSheet(html){$('modal').innerHTML=`<div class="sheet"><div class="sheetBox">${html}</div></div>`}window.openCreate=()=>modalSheet(`<h3>Create</h3><button class="btn" onclick="openPost()">${I.plus} New Post</button><button class="btn secondary" onclick="openPickCreate()">${I.plus} New Pick</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`);window.closeModal=()=>{$('modal').innerHTML=''};window.openPost=()=>{draftMedia=null;modalSheet(`<h3>New Post</h3><textarea class="input" id="postText" placeholder="Write a post..." style="height:90px"></textarea><div id="selectedMedia"></div><button class="btn secondary" onclick="openMedia('post')">${I.film} Pick title</button><button class="btn" onclick="createPost()">${I.send} Post</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`)};window.createPost=async()=>{const text=$('postText')?.value.trim()||'';if(!text&&!draftMedia)return toast('Write or pick title');await push(ref(db,'posts'),{uid,text,media:draftMedia,createdAt:Date.now()});draftMedia=null;closeModal();openProfile(uid)};
window.openMedia=target=>{mediaTarget=target;mediaType='movie';const html=`<div class="sheet"><div class="sheetBox"><h3>Choose title</h3><div class="mode" id="modeText">Currently choosing: Movies</div><div class="tabs"><button class="active" id="movieTab" onclick="setMediaType('movie')">Movies</button><button id="tvTab" onclick="setMediaType('tv')">TV Shows</button></div><input class="input" id="mediaQuery" placeholder="Search movies..." oninput="searchMedia(this.value)"><div id="mediaResults"><div class="empty">Type to search movies</div></div><button class="btn secondary" onclick="${target==='chat'?'closeChatPicker()':'closeModal()'}">Cancel</button></div></div>`;if(target==='chat')$('chatPick').innerHTML=html;else $('modal').innerHTML=html};window.closeChatPicker=()=>{if($('chatPick'))$('chatPick').innerHTML=''};window.setMediaType=t=>{mediaType=t;$('movieTab').classList.toggle('active',t==='movie');$('tvTab').classList.toggle('active',t==='tv');$('modeText').textContent='Currently choosing: '+(t==='movie'?'Movies':'TV Shows');$('mediaQuery').placeholder=t==='movie'?'Search movies...':'Search TV shows...';$('mediaResults').innerHTML=`<div class="empty">Type to search ${t==='movie'?'movies':'TV shows'}</div>`;if($('mediaQuery').value.trim())searchMedia($('mediaQuery').value)};async function api(ep,params={}){const u=new URL(TMDB+ep);u.searchParams.set('api_key',TMDB_KEY);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return (await fetch(u)).json()}window.searchMedia=async q=>{q=q.trim();if(!q)return;const type=mediaType;$('mediaResults').innerHTML=`<div class="empty">Searching ${type==='movie'?'movies':'TV shows'}...</div>`;const d=await api('/search/'+type,{query:q});if(type!==mediaType)return;$('mediaResults').innerHTML=(d.results||[]).slice(0,15).map(x=>{const title=x.title||x.name||'Untitled',poster=x.poster_path||'',ov=x.overview||'';return `<div class="result" onclick="confirmMedia(${x.id},'${type}','${encodeURIComponent(title)}','${encodeURIComponent(poster)}','${encodeURIComponent(ov)}')"><img src="${img(poster,'w92')}"><div><b>${esc(title)}</b><span>${type==='movie'?'Movie':'TV Show'}</span></div><button class="btn">Choose</button></div>`}).join('')||'<div class="empty">No results</div>'};window.confirmMedia=(id,type,title,poster,overview)=>{if(confirm(`Choose this ${type==='movie'?'movie':'TV show'}?`))chooseMedia(id,type,title,poster,overview)};async function chooseMedia(id,type,title,poster,overview){const m={id,type,title:decodeURIComponent(title),poster:decodeURIComponent(poster),overview:decodeURIComponent(overview)};if(mediaTarget==='chat'){await writeMsg({text:m.title,media:m},`Sent ${type}: ${m.title}`);closeChatPicker();return}if(mediaTarget==='pick'){pickItems.push(m);renderPickCreate();return}draftMedia=m;openPost();$('selectedMedia').innerHTML=mediaHTML(m)}
window.openPickCreate=()=>{pickItems=[];pickTitle='';renderPickCreate()};function renderPickCreate(){modalSheet(`<h3>New Pick</h3><input class="input" id="pickTitle" placeholder="Pick title" value="${esc(pickTitle)}" oninput="pickTitle=this.value"><button class="btn secondary" onclick="openMedia('pick')">${I.film} Add title</button><div>${pickItems.map(x=>`<span class="chip">${esc(x.title)}</span>`).join('')}</div><button class="btn" onclick="savePick()">Save Pick</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`)}window.savePick=async()=>{if(!pickItems.length)return toast('Add titles');const items={};pickItems.forEach((x,i)=>items['i'+i]={...x,order:i});await push(ref(db,'picks/'+uid),{title:($('pickTitle')?.value||pickTitle||'Pick').trim(),items,createdAt:Date.now()});pickItems=[];closeModal();openProfile(uid)};
window.viewAllPicks=async u=>{const s=await get(ref(db,'picks/'+u)),p=s.val()||{};$('modal').innerHTML=`<div class="full"><div class="fullTop"><button class="back" onclick="closeModal()">‹</button><b>All Picks</b></div><div class="fullList">${Object.entries(p).map(([id,pk])=>{const f=Object.values(pk.items||{})[0];return `<div class="userRow" onclick="openPick('${u}','${id}')"><div class="pickRing" style="width:48px;height:48px;flex:0 0 48px">${f?.poster?`<img style="width:42px;height:42px" src="${img(f.poster,'w185')}">`:'+'}</div><div><b>${esc(pk.title||'Pick')}</b><span>${Object.keys(pk.items||{}).length} titles</span></div></div>`}).join('')||'<div class="empty card">No picks</div>'}</div></div>`};window.openPick=async(u,id)=>{const s=await get(ref(db,'picks/'+u)),p=s.val()||{};pickSet=Object.entries(p).map(([pid,pk])=>({id:pid,...pk}));pickIdx=Math.max(0,pickSet.findIndex(x=>x.id===id));itemIdx=0;renderViewer()};function renderViewer(){const pk=pickSet[pickIdx];if(!pk)return;const items=Object.values(pk.items||{}).sort((a,b)=>(a.order||0)-(b.order||0)),it=items[itemIdx]||items[0];if(!it)return;$('modal').innerHTML=`<div class="viewer" ontouchstart="swipeX=event.touches[0].clientX" ontouchend="pickSwipe(event)"><div class="bars">${items.map((_,i)=>`<span class="${i===itemIdx?'active':''}"></span>`).join('')}</div><button class="btn viewAllV" onclick="viewCurrentPick()">View all</button><button class="back closeV" onclick="closeModal()">×</button><div class="tap left" onclick="pickPrev()"></div><div class="tap right" onclick="pickNext()"></div><img src="${img(it.poster,'original')}" onclick='detail(${JSON.stringify(it).replace(/'/g,"&#39;")})'><div class="shade"></div><div class="vInfo" onclick='detail(${JSON.stringify(it).replace(/'/g,"&#39;")})'><em>${esc(it.type)}</em><h2>${esc(it.title)}</h2><p>${esc(pk.title||'Pick')} · tap for details</p></div></div>`}window.viewCurrentPick=()=>{const pk=pickSet[pickIdx],items=Object.values(pk.items||{}).sort((a,b)=>(a.order||0)-(b.order||0));$('modal').innerHTML=`<div class="full"><div class="fullTop"><button class="back" onclick="renderViewer()">‹</button><b>${esc(pk.title||'Pick')}</b></div><div class="fullList">${items.map(it=>`<div class="userRow" onclick='detail(${JSON.stringify(it).replace(/'/g,"&#39;")})'><img class="avatar" style="border-radius:8px;width:44px;height:64px" src="${img(it.poster,'w185')}"><div><b>${esc(it.title)}</b><span>${esc(it.type)}</span></div></div>`).join('')}</div></div>`};window.pickNext=()=>{const items=Object.values(pickSet[pickIdx].items||{});if(itemIdx<items.length-1)itemIdx++;else if(pickIdx<pickSet.length-1){pickIdx++;itemIdx=0}else return closeModal();renderViewer()};window.pickPrev=()=>{if(itemIdx>0)itemIdx--;else if(pickIdx>0){pickIdx--;itemIdx=Math.max(0,Object.values(pickSet[pickIdx].items||{}).length-1)}renderViewer()};window.pickSwipe=e=>{const dx=e.changedTouches[0].clientX-swipeX;if(Math.abs(dx)>70){if(dx<0&&pickIdx<pickSet.length-1){pickIdx++;itemIdx=0;renderViewer()}else if(dx>0&&pickIdx>0){pickIdx--;itemIdx=0;renderViewer()}}};
window.showFollow=async(u,type)=>{const s=await get(ref(db,type+'/'+u)),ids=Object.keys(s.val()||{});$('modal').innerHTML=`<div class="full"><div class="fullTop"><button class="back" onclick="closeModal()">‹</button><b>${type==='followers'?'Followers':'Following'}</b></div><div class="fullList">${ids.map(id=>`<div class="userRow" onclick="closeModal();openProfile('${id}')"><img class="avatar" src="${av(id)}"><div><b>${esc(nm(id))}</b><span>@${esc(un(id))}</span></div></div>`).join('')||'<div class="empty card">No users</div>'}</div></div>`};window.editProfile=()=>{const p=profiles[uid]||{};modalSheet(`<h3>Edit Profile</h3><input class="input" id="eName" value="${esc(p.displayName||'')}" placeholder="Display name"><input class="input" id="eUser" value="${esc(p.username||'')}" placeholder="Username"><input class="input" id="ePhoto" value="${esc(p.photo||'')}" placeholder="Photo URL"><textarea class="input" id="eBio" style="height:82px" placeholder="Bio">${esc(p.bio||'')}</textarea><textarea class="input" id="eLinks" style="height:92px" placeholder="Any links, one per line">${esc((p.links||[]).join('\n'))}</textarea><button class="btn" onclick="saveProfile()">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button>`)};window.saveProfile=async()=>{const username=clean($('eUser').value),cur=profiles[uid]?.username;if(username!==cur){const taken=await get(ref(db,'usernames/'+username));if(taken.exists())return toast('Username taken');if(cur)await remove(ref(db,'usernames/'+cur));await set(ref(db,'usernames/'+username),uid);await update(ref(db,'authUsers/'+uid),{username})}await update(ref(db,'profiles/'+uid),{uid,displayName:$('eName').value.trim()||'User',username,photo:$('ePhoto').value.trim(),bio:$('eBio').value.trim(),links:$('eLinks').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,10),updatedAt:Date.now()});closeModal();openProfile(uid)};
